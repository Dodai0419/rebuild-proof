<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor Notes</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;color:#16222e;background:#ffffff}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:#334155;color:#fff}.brand{font-weight:700;font-size:20px}nav a{color:#fff;margin-left:22px;text-decoration:none}
.hero{padding:36px 32px;text-align:left}.hero h1{font-size:44px;line-height:1.15;margin:0 0 12px}.hero p{font-size:19px;margin:0 0 22px;color:#52626f}
button{background:#2563eb;color:#fff;border:0;border-radius:2px;padding:14px 26px;font-size:16px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 32px 40px}.card{background:#fff;border:1px solid #d4dde3;border-radius:2px;padding:22px}.card h2{margin:0 0 6px;font-size:20px}.card p{margin:0;color:#52626f}
footer{padding:22px 32px;background:#334155;color:#fff}
@media(max-width:800px){.cards{grid-template-columns:1fr}.hero h1{font-size:34px}header{padding:14px 18px}.hero{padding:40px 18px}.cards{padding:8px 18px 28px}nav a{margin-left:12px}}
</style></head><body><header><div class="brand">Harbor Notes</div><nav><a href="#a">Features</a><a href="#c">Sign in</a></nav></header>
<main><section class="hero"><h1>A logbook for boats</h1><p>Tides, crew and fuel.</p><button>Start a note</button></section><section class="cards"><div class="card"><h2>Tide tables</h2><p>High and low water.</p></div><div class="card"><h2>Crew list</h2><p>Who is aboard.</p></div></section></main><footer>Harbor Notes is a made-up app for this example.</footer></body></html>
